<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            arabic: ['"Amiri"', 'serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar & Utility */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Reader Themes */
    .reader-light { background-color: #ffffff; color: #1e293b; }
    .reader-light .reader-card { background-color: #f8fafc; border-color: #e2e8f0; }
    .reader-sepia { background-color: #f6eedc; color: #3b2f2f; }
    .reader-sepia .reader-card { background-color: #ede2c8; border-color: #d6c6a5; }
    .reader-dark { background-color: #0f172a; color: #e2e8f0; }
    .reader-dark .reader-card { background-color: #1e293b; border-color: #334155; }

    /* Glossary Term Highlight */
    .glossary-term {
      border-bottom: 2px dashed #10b981;
      background: rgba(16, 185, 129, 0.08);
      padding: 0 4px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .glossary-term:hover {
      background: rgba(16, 185, 129, 0.22);
    }

    /* Intro Kinetic Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.15); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .animate-float { animation: floatSlow 5s ease-in-out infinite; }
    .animate-ring { animation: pulseRing 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
